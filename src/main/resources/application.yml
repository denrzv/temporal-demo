spring:
  application:
    name: service-requests
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/service-requests;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: ${PORT:8080}
demo:
  temporal:
    address: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    task-queue: service-requests
    ui-url: ${TEMPORAL_UI_URL:http://localhost:8233}
    enabled: ${TEMPORAL_ENABLED:true}
  systems-url: ${SYSTEMS_URL:http://localhost:8080/mock/systems}
logging:
  level:
    io.temporal: WARN
